<style>
/* Layout: split hero (copy left, live chat mock right), then demo grid, 3-step line, price table, FAQ. Ink blue on cool paper, one Telegram-blue accent. */
:root{
  --bg:#F1F5F8; --panel:#FFFFFF; --panel2:#E7EEF3; --ink:#0D1B2A; --mute:#4B5E70; --line:#D3DEE6;
  --accent:#0F6CB6; --accent-ink:#FFFFFF; --tint:#DCEBF7; --bubble-me:#0F6CB6; --bubble-me-ink:#FFFFFF; --ok:#1B7A4B;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A131A; --panel:#111E28; --panel2:#182833; --ink:#E8F0F6; --mute:#9FB2C2; --line:#223645;
  --accent:#4DB6F5; --accent-ink:#06141E; --tint:#12303F; --bubble-me:#1E88D0; --bubble-me-ink:#FFFFFF; --ok:#5FD39A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A131A; --panel:#111E28; --panel2:#182833; --ink:#E8F0F6; --mute:#9FB2C2; --line:#223645;
  --accent:#4DB6F5; --accent-ink:#06141E; --tint:#12303F; --bubble-me:#1E88D0; --bubble-me-ink:#FFFFFF; --ok:#5FD39A; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:600 16px var(--body);text-decoration:none;border:1.5px solid var(--accent);cursor:pointer;transition:transform .15s,background .15s}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0}
.logo{font:600 18px var(--display);text-decoration:none;letter-spacing:-.02em}
.logo b{color:var(--accent);font-weight:600}
nav{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
nav a.l{text-decoration:none;color:var(--mute);font-weight:500}
nav a.l:hover{color:var(--ink)}
.lang{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px}
.lang button{border:0;background:transparent;color:var(--mute);font:600 13px var(--body);padding:6px 10px;border-radius:7px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:48px 0 72px}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.1}
.hero p.sub{font-size:19px;color:var(--mute);max-width:52ch;margin:22px 0 30px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:36px 0 0;padding:0;list-style:none;color:var(--mute);font-size:14px}
.facts li{display:flex;flex-direction:column;gap:2px}
.facts b{font:600 22px var(--display);color:var(--ink)}
.phone{justify-self:center;width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:14px;box-shadow:0 24px 60px -30px rgba(13,27,42,.45)}
.phone .bar{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--line)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 14px var(--display)}
.bar strong{display:block;font-size:14px;line-height:1.2}.bar span{font-size:12px;color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:8px;padding:14px 4px 6px}
.m{max-width:84%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4}
.m.bot{background:var(--panel2);border-bottom-left-radius:5px;align-self:flex-start}
.m.me{background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:5px;align-self:flex-end}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start}
.slots span{border:1.5px solid var(--accent);color:var(--accent);border-radius:10px;padding:6px 12px;font:600 13px var(--body)}
.slots span.on{background:var(--accent);color:var(--accent-ink)}
.m.ok{border:1.5px solid var(--ok)}
.m.ok b{color:var(--ok)}
/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
section>.wrap>h2{font-size:clamp(24px,3.2vw,34px);margin-bottom:10px}
.lead{color:var(--mute);max-width:60ch;margin:0 0 34px}
.demos{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:17px}
.card p{margin:0;color:var(--mute);font-size:15px;flex:1}
.card a.go{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.card a.go:hover{text-decoration:underline}
.card.own{background:var(--tint);border-style:dashed;border-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:s}
.step{padding:0 28px 0 0;position:relative;min-width:0}
.step h3{font-size:17px;margin-bottom:8px}
.step p{margin:0;color:var(--mute)}
.step .n{font:600 13px var(--display);color:var(--accent);display:block;margin-bottom:12px}
.price{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plan.top{border:2px solid var(--accent)}
.plan .tag{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.plan h3{font-size:17px}
.plan .p{font:600 28px var(--display);letter-spacing:-.02em}
.plan ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px;flex:1}
.plan li{margin:4px 0}
.note{margin-top:22px;color:var(--mute);font-size:15px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:48px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 22px var(--body);color:var(--accent)}
details[open] summary::after{content:"\2212"}
details p{margin:0 0 16px;color:var(--mute)}
.cta{background:var(--ink);color:var(--bg);border-radius:24px;padding:44px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin:56px 0}
.cta h2{font-size:clamp(22px,3vw,30px);max-width:20ch}
.cta p{margin:8px 0 0;opacity:.8;max-width:46ch}
.cta .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
footer{padding:12px 0 40px;color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:36px;padding:28px 0 52px}
  .steps{grid-template-columns:1fr;gap:26px}.step{padding:0}
  nav a.l{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
