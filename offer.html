<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telegram-бот для вашого бізнесу | WhyNot Agency</title>
<meta name="description" content="Telegram-боти для бізнесу: запис, замовлення, оплата, сповіщення. Ціни від $150.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mut:#5d6580;--line:#e3e6f0;--ac:#2a7bf6;--ac2:#1d5fd0;--ok:#16a06a;--hl:#eef4ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#181d30;--tx:#eef0f8;--mut:#a3abc6;--line:#2a3150;--ac:#4a93ff;--ac2:#6aa6ff;--ok:#3ccf91;--hl:#1b2540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 14px}
.logo{font-weight:800;letter-spacing:.2px}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--ac);border-color:var(--ac);color:#fff}
h1{font-size:28px;line-height:1.2;margin:6px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.vid{width:100%;border-radius:14px;background:#000;display:block;max-height:70vh}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:14px 16px;border:1px solid var(--ac);color:var(--ac);background:var(--card);margin-top:10px}
.btn.pri{background:var(--ac);color:#fff}
.btn:active{transform:scale(.99)}
h2{font-size:20px;margin:28px 0 10px}
.steps{display:grid;gap:8px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 50px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--hl);color:var(--ac);font-weight:800;text-align:center;line-height:24px;font-size:14px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.pk.rec{border-color:var(--ac);box-shadow:0 0 0 2px var(--hl)}
.pk .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pk b{font-size:17px}
.pr{font-weight:800;font-size:20px;color:var(--ac)}
.pk p{margin:6px 0 0;color:var(--mut);font-size:15px}
.tag{font-size:12px;background:var(--hl);color:var(--ac);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.ex{display:grid;gap:8px}
.ex div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.ex span:last-child{font-weight:700;white-space:nowrap}
.note{color:var(--mut);font-size:14px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto}
.bar .btn{margin:0}
footer{color:var(--mut);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="logo">WhyNot Agency</div><div class="lang" id="lang"></div></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <video class="vid" id="vid" controls playsinline preload="metadata"></video>
  <a class="btn" id="demo" target="_blank" rel="noopener"></a>

  <h2 id="hHow"></h2>
  <ol class="steps" id="steps"></ol>

  <h2 id="hPr"></h2>
  <div id="packs"></div>

  <h2 id="hEx"></h2>
  <div class="ex" id="ex"></div>
  <p class="note" id="note"></p>

  <footer id="foot"></footer>
</div>
<div class="bar"><div class="in"><a class="btn pri" id="cta" target="_blank" rel="noopener"></a></div></div>

 ["Enterprise","від $600","Інтеграція з CRM (Bitrix24, KeyCRM), синхронізація залишків (1С, Google), багатомовність.",0]],

 foot:"WhyNot Agency · Telegram-боти для бізнесу",msg:n=>`Доброго дня! Дивився(-лась) ваш сайт${n?` (${n})`:""}. Хочу такого Telegram-бота. Підкажіть, що потрібно для старту?`,vid:"demo_uk.mp4"},
ru:{h1:n=>n?`Telegram-бот для «${n}»`:"Telegram-бот для вашего бизнеса",
 sub:"Клиенты записываются и заказывают сами. Вы получаете каждую заявку в Telegram. Без звонков и долгих переписок.",

 ["Продвинутый","$300–450","Каталог товаров с фото, корзина, онлайн-оплата (LiqPay, Mono, Stripe), доставка.",1],
 ["Онлайн-школы и инфобизнес","$250–400","Автоворонка, выдача уроков, проверка домашних заданий и тестов, закрытые каналы по подписке.",0],
 ["Enterprise","от $600","Интеграция с CRM (Bitrix24, KeyCRM), синхронизация остатков (1С, Google), многоязычность.",0]],
 rec:"популярный",hEx:"Дополнительно",ex:[["Поддержка и хостинг","$20–40 / мес"],["Срочное выполнение","+30%"]],
 note:"Точную сумму рассчитаем под ваши задачи. Ничего придумывать не нужно: достаточно написать нам.",
 foot:"WhyNot Agency · Telegram-боты для бизнеса",msg:n=>`Добрый день! Смотрел(а) ваш сайт${n?` (${n})`:""}. Хочу такого Telegram-бота. Подскажите, что нужно для старта?`,vid:"demo_uk.mp4"},
pl:{h1:n=>n?`Bot Telegram dla „${n}”`:"Bot Telegram dla Twojej firmy",
 sub:"Klienci sami się zapisują i zamawiają. Ty dostajesz każde zgłoszenie w Telegramie. Bez telefonów i długich rozmów.",
 demo:"🤖 Wypróbuj bota demo",cta:"Chcę takiego bota",
 hHow:"Jak to działa",steps:["Oglądasz wideo i testujesz bota demo.","Klikasz „Chcę takiego bota” i piszesz do nas na Telegramie.","Dopytujemy o szczegóły: usługi, ceny, godziny.","Robimy bota dla Ciebie i uruchamiamy."],
 hPr:"Pakiety i ceny",
 packs:[["Podstawowy","$150","Menu usług i cen, rezerwacje online, przypomnienia dla klientów, powiadomienia dla właściciela.",0],
 ["Zaawansowany","$300–450","Katalog produktów ze zdjęciami, koszyk, płatności online (LiqPay, Mono, Stripe), dostawa.",1],
 ["Szkoły online i infobiznes","$250–400","Autolejek, wysyłka lekcji, sprawdzanie zadań i testów, płatne kanały subskrypcyjne.",0],
 ["Enterprise","od $600","Integracja z CRM (Bitrix24, KeyCRM), synchronizacja stanów (1C, Google), wielojęzyczność.",0]],

 foot:"WhyNot Agency · Boty Telegram dla biznesu",msg:n=>`Dzień dobry! Widziałem(-am) waszą stronę${n?` (${n})`:""}. Chcę takiego bota Telegram. Co jest potrzebne na start?`,vid:"demo_en.mp4"},
en:{h1:n=>n?`A Telegram bot for ${n}`:"A Telegram bot for your business",
 sub:"Customers book and order on their own. You get every request in Telegram. No calls, no long chats.",
 demo:"🤖 Try the demo bot",cta:"I want this bot",
 hHow:"How it works",steps:["Watch the video and try the demo bot.","Tap “I want this bot” and message us on Telegram.","We ask a few details: services, prices, hours.","We build the bot for you and launch it."],
 hPr:"Packages & prices",
 packs:[["Basic","$150","Services & price menu, online booking, client reminders, owner notifications.",0],
 ["Advanced","$300–450","Product catalog with photos, cart, online payments (LiqPay, Mono, Stripe), delivery.",1],
 ["Online schools & infobusiness","$250–400","Autofunnel, lesson delivery, homework and test checks, paid subscription channels.",0],
 ["Enterprise","from $600","CRM integration (Bitrix24, KeyCRM), stock sync (1C, Google), multi-language.",0]],
 rec:"popular",hEx:"Extras",ex:[["Support & hosting","$20–40 / month"],["Rush delivery","+30%"]],
 note:"We quote the exact price for your needs. You don’t have to prepare anything: just message us.",
 foot:"WhyNot Agency · Telegram bots for business",msg:n=>`Hi! I saw your page${n?` (${n})`:""}. I want a Telegram bot like this. What do you need to get started?`,vid:"demo_en.mp4"}
};
const q=new URLSearchParams(location.search);
const name=(q.get("n")||"").replace(/[-_+]+/g," ").slice(0,60).trim();
let lg=q.get("lang");
if(!T[lg]){let b=(navigator.language||"uk").slice(0,2);lg=T[b]?b:"uk"}
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draw(){
 const t=T[lg];document.documentElement.lang=lg;
 $("h1").textContent=t.h1(name);$("sub").textContent=t.sub;
 $("demo").textContent=t.demo;$("demo").href=DEMO;
 $("cta").textContent=t.cta;$("cta").href=`https://t.me/${TG}?text=`+encodeURIComponent(t.msg(name));
 $("hHow").textContent=t.hHow;$("hPr").textContent=t.hPr;$("hEx").textContent=t.hEx;
 $("steps").innerHTML=t.steps.map(s=>`<li>${esc(s)}</li>`).join("");
 $("packs").innerHTML=t.packs.map(p=>`<div class="pk${p[3]?" rec":""}"><div class="h"><b>${esc(p[0])}${p[3]?`<span class="tag">${esc(t.rec)}</span>`:""}</b><span class="pr">${esc(p[1])}</span></div><p>${esc(p[2])}</p></div>`).join("");
 $("ex").innerHTML=t.ex.map(e=>`<div><span>${esc(e[0])}</span><span>${esc(e[1])}</span></div>`).join("");
 $("note").textContent=t.note;$("foot").textContent=t.foot;
 const v=$("vid"),src="media/"+t.vid;if(v.getAttribute("data-s")!==src){v.setAttribute("data-s",src);v.src=src}
 $("lang").innerHTML=Object.keys(T).map(k=>`<button class="${k===lg?"on":""}" data-l="${k}">${k.toUpperCase()}</button>`).join("");
 document.title=t.h1(name)+" | WhyNot Agency";
}
$("lang").onclick=e=>{const l=e.target.dataset&&e.target.dataset.l;if(l){lg=l;draw()}};
draw();
</script>
</body>
</html>
